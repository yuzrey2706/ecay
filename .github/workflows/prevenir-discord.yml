# Prévient le serveur Discord dès qu'une version est publiée.
#
# Déclenché par l'événement "release published" : le message part dans la
# seconde qui suit la mise en ligne, pas au bout d'un délai de sondage.
# workflow_dispatch permet de lancer le job à la main pour vérifier que le
# lien et les en-têtes arrivent bien au serveur.
#
# Le jeton du webhook vit dans les secrets du dépôt (DISCORD_WEBHOOK) :
# il n'est écrit nulle part dans les fichiers du projet.
name: Prévenir Discord

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  message:
    name: Message au serveur
    runs-on: ubuntu-latest
    steps:
      - name: Construire et envoyer le message
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name || 'test' }}
          NOM: ${{ github.event.release.name || 'ECAY — test du veilleur' }}
          CORPS: ${{ github.event.release.body || 'Aucune note publiée.' }}
          LIEN: ${{ github.event.release.html_url || 'https://github.com/yuzrey2706/ecay/releases' }}
        run: |
          set -eu
          # Le tag v1.9.3 donne le nom exact de l'asset à télécharger.
          VERSION="${TAG#v}"
          ASSET="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ECAY-Setup-${VERSION}.exe"
          FEED="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/version.json"

          jq -n \
            --arg nom    "$NOM" \
            --arg corps  "$CORPS" \
            --arg lien   "$LIEN" \
            --arg asset  "$ASSET" \
            --arg feed   "$FEED" \
            '{
              username: "ECAY Mises à jour",
              embeds: [{
                title:       ($nom + " — prête à télécharger"),
                description: ($corps | .[0:1200]),
                url:         $lien,
                color:       11032055,
                fields: [
                  {name: "Télécharger",        value: $asset, inline: false},
                  {name: "Flux de mise à jour", value: $feed, inline: false}
                ],
                footer:   {text: "Publication automatique — release GitHub"},
                timestamp: (now | todate)
              }]
            }' > payload.json

          CODE=$(curl -sS -o reponse.txt -w '%{http_code}' \
                 -H 'Content-Type: application/json' \
                 --data @payload.json \
                 "$WEBHOOK")

          echo "Discord : HTTP ${CODE}"
          if [ "$CODE" != "204" ]; then
            echo "corps de la réponse :"; cat reponse.txt; echo
            exit 1
          fi
